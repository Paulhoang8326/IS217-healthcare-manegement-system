name: Backend

on:
  push:
    paths:
      - 'backend/**'
  pull_request:
    paths:
      - 'backend/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_only
          MYSQL_DATABASE: healthcare_test
          MYSQL_USER: healthcare
          MYSQL_PASSWORD: ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci_root_only --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, curl, dom, xml, gd, zip, fileinfo, pdo_mysql
          coverage: none
          tools: composer:v2
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress
      - run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: healthcare_test
          DB_USERNAME: healthcare
          DB_PASSWORD: ci_only
      - name: Check HTTP concurrency
        env:
          APP_NAME: Healthcare
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_DEBUG: 'false'
          APP_URL: http://127.0.0.1:8000
          APP_LOCALE: en
          APP_FALLBACK_LOCALE: en
          APP_MAINTENANCE_DRIVER: file
          LOG_CHANNEL: single
          LOG_LEVEL: debug
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: healthcare_test
          DB_USERNAME: healthcare
          DB_PASSWORD: ci_only
          DB_URL: ''
          CACHE_STORE: file
          SESSION_DRIVER: file
          QUEUE_CONNECTION: sync
          FILESYSTEM_DISK: local
          BROADCAST_CONNECTION: 'null'
          JWT_SECRET: ci_http_only
          JWT_ACCESS_TOKEN_EXPIRATION_MS: '600000'
          SEPAY_WEBHOOK_SECRET: ci_http_only
          SEPAY_ACCOUNT_NUMBER: '123456'
          PHP_CLI_SERVER_WORKERS: '1'
        run: |
          set -euo pipefail
          test "$DB_DATABASE" = healthcare_test
          php artisan config:clear
          php artisan route:clear
          php artisan migrate:fresh --force --no-interaction
          server_pids=()
          cleanup() {
            for pid in "${server_pids[@]}"; do
              kill -- -"$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            done
          }
          trap cleanup EXIT
          for port in 8000 8001; do
            setsid php artisan serve --no-reload --host=127.0.0.1 --port="$port" > "$RUNNER_TEMP/hms-http-$port.log" 2>&1 &
            server_pids+=("$!")
          done
          for port in 8000 8001; do
            ready=false
            for attempt in $(seq 1 30); do
              if curl --fail --silent --output /dev/null "http://127.0.0.1:$port/up"; then
                ready=true
                break
              fi
              sleep 0.2
            done
            if [[ "$ready" != true ]]; then
              cat "$RUNNER_TEMP/hms-http-$port.log"
              exit 1
            fi
          done
          php app/Modules/Appointment/Tests/http-concurrency.php --base-url=http://127.0.0.1:8000 --secondary-base-url=http://127.0.0.1:8001 --iterations=3
