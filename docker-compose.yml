name: healthcare

services:
  backend:
    build: ./backend
    command: sh -c "composer install --no-interaction --prefer-dist && php artisan serve --no-reload --host=0.0.0.0 --port=8000"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    command:
      - --transaction-isolation=READ-COMMITTED
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in backend/.env}
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in backend/.env}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in backend/.env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
